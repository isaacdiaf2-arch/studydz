version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: studydz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: studydz
      POSTGRES_USER: studydz
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studydz -d studydz"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: on-premise/Dockerfile
    container_name: studydz-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./secrets/app.env
    environment:
      NODE_ENV: production
      PORT: 3000
    secrets:
      - db_password
    ports:
      - "3000:3000"
    volumes:
      - ./license.json:/app/license.json:ro
      - ./data:/app/data
    command: ["sh", "-c", "export DATABASE_URL=postgres://studydz:$$(cat /run/secrets/db_password)@db:5432/studydz && node .output/server/index.mjs"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db-data:
